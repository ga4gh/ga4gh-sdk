site_name: GA4GH SDK
site_description: >-
  Rust library, command-line tool and Python bindings for GA4GH API services
# Read the Docs serves each version under its own path (e.g., `/en/latest/`)
site_url: !ENV [READTHEDOCS_CANONICAL_URL, "https://ga4gh-sdk.readthedocs.io/en/latest/"]
repo_url: https://github.com/ga4gh/ga4gh-sdk
repo_name: ga4gh/ga4gh-sdk
# Pages keep their paths in the repository (see `docs/hooks.py`)
edit_uri: edit/main/

# The pages are the Markdown files of the repository that `nav` lists, at
# their paths in the repository, so that the guides stay where they are and
# their links work on GitHub and on the site alike; `docs/hooks.py` collects
# them (and `images/`, the Rust API reference) instead of the files of
# `docs_dir`, and points links to other files of the repository to GitHub
docs_dir: docs
hooks:
  - docs/hooks.py

# Files included in the site besides `docs/` (for `mkdocs serve`)
watch:
  - README.md
  - cli/README.md
  - examples
  - images
  - python/README.md
  - python/api.md
  - python/ga4gh_sdk.pyi
  - tests/README.md

theme:
  name: material
  features:
    - content.action.edit
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

plugins:
  - search
  # The Python API reference (`python/api.md`), from the type stubs: Griffe
  # finds them as the stub-only package `target/python-stubs/ga4gh_sdk/`,
  # into which `docs/hooks.py` copies `python/ga4gh_sdk.pyi`, so that the
  # build needs no compiled bindings. Its warnings, such as a module that isn't found or a
  # documented parameter that the signature lacks, fail the strict build
  - mkdocstrings:
      handlers:
        python:
          paths: [target/python-stubs]
          options:
            # Renders methods declared only with `@overload`, such as `Task.wait`
            extensions: [docs/griffe_overloads.py]
            docstring_style: google
            show_root_heading: true
            show_root_full_path: false
            heading_level: 2
            members_order: source
            group_by_category: false
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            show_source: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            # Private aliases such as `_JSONObject` stay out; dunder methods with
            # docstrings, such as `__len__`, stay in
            filters: ["!^_[^_]"]

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

# Paths in the repository. Markdown files that are not listed here are not
# part of the site; links to them go to GitHub
nav:
  - Home: README.md
  - Guides:
      - Usage: docs/usage.md
      - Authentication: docs/authentication.md
      - API compatibility: docs/api_compatibility.md
      - Command-line tool: cli/README.md
      - Python bindings: python/README.md
      - Downstream use: docs/downstream.md
      - Experimental:
          - Workflow contracts: docs/workflow-contracts.md
          - Result reuse: docs/result-reuse.md
          - Sequence QC example: examples/sequence-qc/README.md
          - Result reuse example: examples/result-reuse/README.md
  - API reference:
      # Built by `cargo doc` before the site (see `docs/development.md`)
      - Rust library: rust/ga4gh_sdk/index.html
      - Rust CLI library: rust/ga4gh_cli/index.html
      # Rendered from the type stubs by mkdocstrings (see `plugins`)
      - Python bindings: python/api.md
  - Development:
      - Developer guide: DEVELOPER_GUIDE.md
      - Overview: docs/development.md
      - Testing: tests/README.md
      - Generated models: docs/autogenerate_OAI_models.md
      - Reviewing pull requests: docs/reviewer_framework.md
      - Client state ownership: docs/state_ownership.md
      - Releasing: docs/releasing.md
      - Downstream example: examples/downstream-sdk/README.md
      - Provider contract proposals:
          - docs/rfcs/README.md
          - Leased sessions: docs/rfcs/leased-sessions.md
          - Workload secrets: docs/rfcs/workload-secrets.md
          - Feasibility examples: examples/provider-contracts/README.md
