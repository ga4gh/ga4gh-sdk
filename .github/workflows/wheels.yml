name: Python distributions

# Builds the Python distributions: one abi3 wheel per platform and an sdist.
# Called by CI (build only) and by Release (build, then publish).
on:
  workflow_call:

permissions:
  contents: read

jobs:
  wheel:
    name: Build wheel (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux x86-64
            id: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64
            smoke: true
          - platform: Linux aarch64
            id: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64
            smoke: true
          - platform: macOS x86-64
            id: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            smoke: true
          - platform: macOS arm64
            id: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            smoke: true
          - platform: Windows x86-64
            id: windows-x86_64
            runner: windows-2025
            target: x64
            smoke: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # The lowest supported Python; the abi3 wheel also covers newer ones.
          python-version: '3.11'
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.15.0
          working-directory: python
          target: ${{ matrix.target }}
          # The Python build uses rustls and native certificate roots; no
          # OpenSSL development package or bundled libssl is required.
          manylinux: '2_28'
          args: --release --locked --out dist
      - name: Import the wheel
        if: matrix.smoke
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          if [[ "$RUNNER_OS" == Windows ]]; then
            venv_python="$RUNNER_TEMP/smoke/Scripts/python"
          else
            venv_python="$RUNNER_TEMP/smoke/bin/python"
          fi
          "$venv_python" -m pip install --no-index --no-deps python/dist/*.whl
          cd "$RUNNER_TEMP"
          "$venv_python" -c 'import ga4gh_sdk; print(ga4gh_sdk.TES.__name__, ga4gh_sdk.Configuration.__name__)'
      - name: Check Linux wheel excludes OpenSSL libraries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python - <<'PY'
          from glob import glob
          from zipfile import ZipFile

          wheels = glob('python/dist/*.whl')
          assert len(wheels) == 1, wheels
          with ZipFile(wheels[0]) as wheel:
              linked = [name for name in wheel.namelist()
                        if 'libssl' in name.lower() or 'libcrypto' in name.lower()]
          assert not linked, f'OpenSSL libraries were bundled: {linked}'
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-wheel-${{ matrix.id }}
          path: python/dist/*.whl
          if-no-files-found: error

  sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.15.0
          working-directory: python
          command: sdist
          args: --out dist
      - name: Install the sdist and import it
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/sdist"
          "$RUNNER_TEMP/sdist/bin/python" -m pip install python/dist/*.tar.gz
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/sdist/bin/python" -c 'import ga4gh_sdk; print(ga4gh_sdk.TES.__name__)'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-sdist
          path: python/dist/*.tar.gz
          if-no-files-found: error
