name: Release

# Publishes the release artefacts of a version tag (v<workspace version>):
# the Python distributions, then the CLI image. The ga4gh/ga4gh-sdk
# repository publishes to PyPI, forks to TestPyPI; the repository variable
# PYPI_INDEX (pypi or testpypi) overrides that default. The image goes to
# ghcr.io/<repository owner>/ga4gh-cli. See docs/releasing.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      index: ${{ steps.index.outputs.index }}
      version: ${{ steps.version.outputs.version }}
      project: ${{ steps.version.outputs.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag against the workspace version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys
          import tomllib

          with open('Cargo.toml', 'rb') as manifest:
              version = tomllib.load(manifest)['workspace']['package']['version']
          tag = os.environ['TAG']
          print(f'tag: {tag}, workspace version: {version}')
          if tag != f'v{version}':
              sys.exit(f'::error::Tag {tag} does not match the workspace version v{version}')
          with open('python/pyproject.toml', 'rb') as manifest:
              project = tomllib.load(manifest)['project']['name']
          project = re.sub(r'[-_.]+', '-', project).lower()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'version={version}', file=output)
              print(f'project={project}', file=output)
          PY
      - name: Check that the tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main"
            exit 1
          fi
      - name: Choose the package index
        id: index
        env:
          OVERRIDE: ${{ vars.PYPI_INDEX }}
          UPSTREAM: ${{ github.repository == 'ga4gh/ga4gh-sdk' }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ -n "$OVERRIDE" ]]; then
            index="$OVERRIDE"
          elif [[ "$UPSTREAM" == true ]]; then
            index=pypi
          else
            index=testpypi
          fi
          if [[ "$index" != pypi && "$index" != testpypi ]]; then
            echo "::error::PYPI_INDEX must be pypi or testpypi, not $index"
            exit 1
          fi
          if [[ "$UPSTREAM" == true && "$index" == testpypi ]]; then
            if [[ "$VERSION" != *-* ]]; then
              echo "::error::Use a distinct pre-release version and tag for an upstream TestPyPI rehearsal"
              exit 1
            fi
            echo "::warning::PYPI_INDEX sends this release to TestPyPI, not PyPI"
          fi
          echo "index=$index" >> "$GITHUB_OUTPUT"
          echo "Publishing to $index" >> "$GITHUB_STEP_SUMMARY"

  wheels:
    name: Release wheels
    needs: prepare
    uses: ./.github/workflows/wheels.yml

  # Builds, checks and pushes the platform images by digest, without a tag
  image:
    name: Release image
    needs: prepare
    permissions:
      contents: read
      packages: write # push the platform images to ghcr.io
    uses: ./.github/workflows/image.yml
    with:
      push: true

  # Waits for the image too, so that nothing irreversible happens before
  # every artefact of the release is built.
  publish:
    name: Publish package
    needs: [prepare, wheels, image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ needs.prepare.outputs.index }}
      url: ${{ needs.prepare.outputs.index == 'pypi' && format('https://pypi.org/p/{0}', needs.prepare.outputs.project) || format('https://test.pypi.org/p/{0}', needs.prepare.outputs.project) }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: python-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: ${{ needs.prepare.outputs.index == 'pypi' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}

  # Runs after the package is on the index: tags the multi-platform image with
  # the version and records its build provenance. A re-run moves the tag to
  # the images of that run. An upstream TestPyPI rehearsal tags no image.
  image-publish:
    name: Publish image
    needs: [prepare, image, publish]
    if: needs.prepare.outputs.index == 'pypi' || github.repository != 'ga4gh/ga4gh-sdk'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      attestations: write # record the build provenance of the image
      id-token: write # sign the provenance attestation
      packages: write # push the image index, its tag and the attestation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-digest-*
          path: digests
          merge-multiple: true
      - name: Log in to the GitHub Container Registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s\n' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Tag the image
        id: index
        env:
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          repository="ghcr.io/${OWNER,,}/ga4gh-cli"
          # OCI tags can't hold "+", so build metadata becomes "_"
          tag="$repository:${VERSION//+/_}"
          sources=()
          for file in digests/*; do
            sources+=("$repository@$(cat "$file")")
          done
          # A missing platform fails the Release image job, so this job doesn't run
          if [[ "${#sources[@]}" -eq 0 ]]; then
            echo "::error::No platform images found"
            exit 1
          fi
          docker buildx imagetools create --tag "$tag" "${sources[@]}"
          digest="$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | python3 -c 'import json, sys; print(json.load(sys.stdin)["digest"])')"
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Image: $tag ($repository@$digest)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.index.outputs.repository }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
