name: Release

# Publishes the release artefacts of a version tag (v<workspace version>);
# for now the Python distributions. The ga4gh/ga4gh-sdk repository publishes
# to PyPI, forks to TestPyPI; the repository variable PYPI_INDEX (pypi or
# testpypi) overrides that default. See docs/releasing.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      index: ${{ steps.index.outputs.index }}
      version: ${{ steps.version.outputs.version }}
      project: ${{ steps.version.outputs.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag against the workspace version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys
          import tomllib

          with open('Cargo.toml', 'rb') as manifest:
              version = tomllib.load(manifest)['workspace']['package']['version']
          tag = os.environ['TAG']
          print(f'tag: {tag}, workspace version: {version}')
          if tag != f'v{version}':
              sys.exit(f'::error::Tag {tag} does not match the workspace version v{version}')
          with open('python/pyproject.toml', 'rb') as manifest:
              project = tomllib.load(manifest)['project']['name']
          project = re.sub(r'[-_.]+', '-', project).lower()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'version={version}', file=output)
              print(f'project={project}', file=output)
          PY
      - name: Check that the tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main"
            exit 1
          fi
      - name: Choose the package index
        id: index
        env:
          OVERRIDE: ${{ vars.PYPI_INDEX }}
          UPSTREAM: ${{ github.repository == 'ga4gh/ga4gh-sdk' }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ -n "$OVERRIDE" ]]; then
            index="$OVERRIDE"
          elif [[ "$UPSTREAM" == true ]]; then
            index=pypi
          else
            index=testpypi
          fi
          if [[ "$index" != pypi && "$index" != testpypi ]]; then
            echo "::error::PYPI_INDEX must be pypi or testpypi, not $index"
            exit 1
          fi
          if [[ "$UPSTREAM" == true && "$index" == testpypi ]]; then
            if [[ "$VERSION" != *-* ]]; then
              echo "::error::Use a distinct pre-release version and tag for an upstream TestPyPI rehearsal"
              exit 1
            fi
            echo "::warning::PYPI_INDEX sends this release to TestPyPI, not PyPI"
          fi
          echo "index=$index" >> "$GITHUB_OUTPUT"
          echo "Publishing to $index" >> "$GITHUB_STEP_SUMMARY"

  wheels:
    name: Release wheels
    needs: prepare
    uses: ./.github/workflows/wheels.yml

  publish:
    name: Publish package
    needs: [prepare, wheels]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ needs.prepare.outputs.index }}
      url: ${{ needs.prepare.outputs.index == 'pypi' && format('https://pypi.org/p/{0}', needs.prepare.outputs.project) || format('https://test.pypi.org/p/{0}', needs.prepare.outputs.project) }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: python-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: ${{ needs.prepare.outputs.index == 'pypi' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
