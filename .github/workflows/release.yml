name: Release

# Publishes the release artefacts of a version tag (v<workspace version>):
# the Python distributions to a package index, then the CLI binaries to a
# draft GitHub release. The ga4gh/ga4gh-sdk repository publishes to PyPI,
# forks to TestPyPI; the repository variable PYPI_INDEX (pypi or testpypi)
# overrides that default. See docs/releasing.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      index: ${{ steps.index.outputs.index }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag against the workspace version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import sys
          import tomllib

          with open('Cargo.toml', 'rb') as manifest:
              version = tomllib.load(manifest)['workspace']['package']['version']
          tag = os.environ['TAG']
          print(f'tag: {tag}, workspace version: {version}')
          if tag != f'v{version}':
              sys.exit(f'::error::Tag {tag} does not match the workspace version v{version}')
          # Every release before 1.0.0, and every version with a pre-release
          # part (for example 1.1.0-rc.1), is a GitHub pre-release.
          prerelease = version.startswith('0.') or '-' in version.split('+')[0]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'version={version}', file=output)
              print(f'prerelease={str(prerelease).lower()}', file=output)
          PY
      - name: Check that the tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main"
            exit 1
          fi
      - name: Choose the package index
        id: index
        env:
          OVERRIDE: ${{ vars.PYPI_INDEX }}
          UPSTREAM: ${{ github.repository == 'ga4gh/ga4gh-sdk' }}
        run: |
          if [[ -n "$OVERRIDE" ]]; then
            index="$OVERRIDE"
          elif [[ "$UPSTREAM" == true ]]; then
            index=pypi
          else
            index=testpypi
          fi
          if [[ "$index" != pypi && "$index" != testpypi ]]; then
            echo "::error::PYPI_INDEX must be pypi or testpypi, not $index"
            exit 1
          fi
          if [[ "$UPSTREAM" == true && "$index" == testpypi ]]; then
            echo "::warning::PYPI_INDEX sends this release to TestPyPI, not PyPI"
          fi
          echo "index=$index" >> "$GITHUB_OUTPUT"
          echo "Publishing to $index" >> "$GITHUB_STEP_SUMMARY"

  wheels:
    name: Release wheels
    needs: prepare
    uses: ./.github/workflows/wheels.yml

  # Waits for the CLI binaries too, so that nothing irreversible happens
  # before every artefact of the release is built.
  publish:
    name: Publish package
    needs: [prepare, wheels, binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ needs.prepare.outputs.index }}
      url: ${{ needs.prepare.outputs.index == 'pypi' && 'https://pypi.org/p/ga4gh-sdk' || 'https://test.pypi.org/p/ga4gh-sdk' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: python-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: ${{ needs.prepare.outputs.index == 'pypi' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}

  binaries:
    name: Release binaries
    needs: prepare
    uses: ./.github/workflows/binaries.yml

  # Runs last, after the package is on the index: a draft release with the
  # CLI archives, their checksums and GitHub's generated notes. Maintainers
  # add the curated notes and publish it.
  github-release:
    name: GitHub release
    needs: [prepare, binaries, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      attestations: write # record the build provenance of the archives
      contents: write # create the draft release and upload its files
      id-token: write # sign the provenance attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true
      - name: Write checksums
        working-directory: dist
        run: |
          sha256sum -- ga4gh-cli-* > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Create the draft release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          TAG: ${{ github.ref_name }}
        run: |
          # A re-run replaces the files of the draft it created before; a
          # published release is left alone.
          if is_draft="$(gh release view "$TAG" --json isDraft --jq .isDraft 2> view-error.txt)"; then
            if [[ "$is_draft" != true ]]; then
              echo "::error::The release $TAG is already published"
              exit 1
            fi
            gh release upload "$TAG" dist/* --clobber
          elif grep -q 'release not found' view-error.txt; then
            flags=(--draft --verify-tag --generate-notes --title "$TAG")
            if [[ "$PRERELEASE" == true ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$TAG" "${flags[@]}" dist/*
          else
            # Creating a draft now could leave two drafts for one tag.
            cat view-error.txt
            echo "::error::Could not check for an existing release of $TAG"
            exit 1
          fi
          echo "Draft release: $(gh release view "$TAG" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"
