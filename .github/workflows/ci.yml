name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run unit and documentation tests
        run: cargo test --workspace --locked

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check dependency lockfile
        run: cargo metadata --format-version 1 --locked > /dev/null
      - name: Build library alone
        run: cargo build --locked -p ga4gh-lib
      - name: Build CLI alone
        run: cargo build --locked -p ga4gh-cli

  python:
    name: Python tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The lowest supported and newest released Python versions.
        python: ['3.11', '3.15']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install Maturin and pytest
        run: python -m pip install 'maturin==1.7.0' 'pytest==8.3.5'
      - name: Build and install the bindings
        working-directory: python
        run: |
          maturin build --locked --interpreter python --out "$RUNNER_TEMP/wheels"
          python -m pip install "$RUNNER_TEMP"/wheels/*.whl
      - name: Run Python tests
        working-directory: python
        run: python -m pytest

  integration:
    name: Integration (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [funnel, wes-starter-kit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check whether this suite is affected
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          SUITE: ${{ matrix.suite }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch || -z "$BASE_SHA" ]]; then
            run_suite=true
          else
            common=(.github/workflows/ci.yml Cargo.toml Cargo.lock lib/Cargo.toml rust-toolchain.toml)
            if [[ "$SUITE" == funnel ]]; then
              paths=("${common[@]}" run-integration-tests.sh lib/src/clients/tes/
                lib/src/clients/serviceinfo/ lib/src/utils/ lib/src/clients/mod.rs
                lib/src/lib.rs lib/tests/funnel_tes.rs lib/tests/funnel_service_info.rs)
            else
              paths=("${common[@]}" tests/run-wes-docker-integration.sh
                tests/fixtures/wes-nextflow/ lib/src/clients/wes/ lib/src/utils/
                lib/src/clients/mod.rs lib/src/lib.rs lib/tests/wes_starter_kit_docker.rs
                cli/Cargo.toml cli/src/ cli/tests/wes_starter_kit_docker.rs)
            fi
            if git diff --quiet "$BASE_SHA" "$GITHUB_SHA" -- "${paths[@]}"; then
              run_suite=false
            else
              run_suite=true
            fi
          fi
          echo "run=$run_suite" >> "$GITHUB_OUTPUT"
          echo "$SUITE: run=$run_suite" >> "$GITHUB_STEP_SUMMARY"
      - name: Install Funnel
        if: matrix.suite == 'funnel' && steps.changes.outputs.run == 'true'
        shell: bash
        run: |
          archive=funnel-linux-amd64-v0.11.14.tar.gz
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/$archive" \
            "https://github.com/calypr/funnel/releases/download/v0.11.14/$archive"
          echo "007e85ee808f131034854f6868efc9b11d3205f2fc1c778f339b484e9271996b  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" funnel
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Test against Funnel
        if: matrix.suite == 'funnel' && steps.changes.outputs.run == 'true'
        run: bash run-integration-tests.sh
      - name: Test against Starter Kit WES
        if: matrix.suite == 'wes-starter-kit' && steps.changes.outputs.run == 'true'
        run: tests/run-wes-docker-integration.sh

  # Coverage of the unit tests, without the generated models; the report
  # goes to the job summary and the `coverage` artifact (LCOV)
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain and LLVM tools
        run: |
          rustup toolchain install
          rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Measure coverage
        run: make coverage
      - name: Write job summary
        run: |
          {
            echo '## Coverage'
            echo
            echo 'Unit tests, without documentation tests and generated models.'
            echo
            echo '```text'
            cat coverage/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error

  # Hooks from `.pre-commit-config.yaml`; the Rust hooks are skipped, because
  # the `lint` job runs the same commands
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      # Not bumped by Dependabot (no Python manifest); update manually
      - name: Install pre-commit
        run: python -m pip install 'pre-commit==4.7.0'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run pre-commit hooks
        env:
          SKIP: cargo-fmt,cargo-clippy
        run: pre-commit run --all-files --show-diff-on-failure

  passed:
    name: CI passed
    needs: [lint, test, build, python, integration, coverage, pre-commit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check all jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          results = {name: job['result'] for name, job in json.loads(os.environ['NEEDS']).items()}
          for name, result in results.items():
              print(f'{name}: {result}')
          expected = {
              'lint', 'test', 'build', 'python', 'integration', 'coverage', 'pre-commit'
          }
          if set(results) != expected or any(
              result != 'success' for result in results.values()
          ):
              sys.exit(1)
          PY
