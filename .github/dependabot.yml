version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Rust crates in the core and workflow provider lockfiles, including those of the
  # Python bindings. Semver-compatible updates come as one PR; each
  # incompatible update, such as a new 0.x minor version, comes on its own.
  - package-ecosystem: cargo
    directories:
      - /
      - /extensions/workflow
    schedule:
      interval: weekly
    groups:
      cargo:
        update-types:
          - minor
          - patch
  # Python packages in `python/pyproject.toml`: the build backend and the
  # exact versions of the `docs` dependency group
  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: weekly
  # Hook revisions in `.pre-commit-config.yaml`
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
  # Base image digests in the `Dockerfile`. The Rust version must match
  # `rust-toolchain.toml`, so new Rust versions are changed by hand.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: rust
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
