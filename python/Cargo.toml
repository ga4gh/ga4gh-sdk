[package]
name = "ga4gh"
version.workspace = true
authors.workspace = true
edition.workspace = true
readme.workspace = true
license-file.workspace = true
repository.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "ga4gh"
crate-type = ["cdylib", "rlib"]

[dependencies]
async-trait = "0.1.81"
ga4gh-lib = { path = "../lib", default-features = false, features = ["rustls-native-roots"] }
pyo3 = { version = "0.30.1", features = ["abi3-py311", "experimental-async"] }
pyo3-async-runtimes = { version = "0.30.0", features = ["tokio-runtime"] }
reqwest = { version = "0.11", default-features = false, features = ["multipart"] }
serde = "1.0.213"
serde_json = "1.0.132"
tokio = { version = "1.41.0", features = ["macros", "rt", "sync"] }
url = "2.5.2"

[features]
default = ["extension-module"]
# Builds the Python module. Rust crates that depend on this one can turn it off with
# `default-features = false`, for example to link their tests against libpython.
extension-module = ["pyo3/extension-module"]

[build-dependencies]
pyo3-build-config = "0.30.1"

[package.metadata.maturin]
name = "ga4gh_sdk"
bindings = "pyo3"
