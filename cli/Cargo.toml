[package]
name = "ga4gh-cli"
description = """
A cross-platform command-line tool leveraging the GA4GH SDK
"""
repository = "https://github.com/ga4gh/ga4gh-sdk/tree/main/cli"
version.workspace = true
authors.workspace = true
edition.workspace = true
readme.workspace = true
license-file.workspace = true

[dependencies]
ga4gh-lib = { path = "../lib", features = ["workflow-contracts"] }
clap = "4"
tokio = { version = "1", features = ["full"] }
serde = "1"
serde_json = "^1.0"
tempfile = "3.2"
dirs = "5.0.1"
anyhow = "1.0.86"
url = "2.5.2"
log = "0.4.22"
env_logger = "0.11.5"
futures-util = "0.3"
percent-encoding = "2"
# Same major version as ga4gh-lib; `stream` reads downloads in chunks.
reqwest = { version = "0.11", features = ["stream"] }
# S3 downloads, configured from the standard AWS environment variables.
object_store = { version = "0.12", default-features = false, features = ["aws"] }

[features]
# Runs the TES file commands against Funnel; see tests/README.md.
integration_tests = []
# Runs the CLI against Starter Kit WES; see tests/README.md.
wes_docker_integration_tests = []

[dev-dependencies]
mockito = "0.31"

[[bin]]
name = "ga4gh-cli"
path = "src/main.rs"
