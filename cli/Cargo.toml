[package]
name = "ga4gh-cli"
description = """
A cross-platform command-line tool leveraging the GA4GH SDK
"""
repository = "https://github.com/ga4gh/ga4gh-sdk/tree/main/cli"
version.workspace = true
authors.workspace = true
edition.workspace = true
readme.workspace = true
license-file.workspace = true

[dependencies]
ga4gh-lib = { path = "../lib", features = ["workflow-contracts"] }
clap = "4"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "^1.0"
tempfile = "3.2"
async-trait = "0.1"
dirs = "5.0.1"
anyhow = "1.0.86"
url = "2.5.2"
log = "0.4.22"
env_logger = "0.11.5"

[features]
# Runs the CLI against Starter Kit WES; see tests/README.md.
wes_docker_integration_tests = []
# Runs the `tes` commands against proTES with an access token; see
# tests/README.md.
protes_integration_tests = []
# Runs the `tes` commands against Funnel; see tests/README.md.
integration_tests = []

[dev-dependencies]
mockito = "0.31"

[[bin]]
name = "ga4gh-cli"
path = "src/main.rs"
