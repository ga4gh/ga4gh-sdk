[package]
name = "ga4gh-cli"
description = """
A cross-platform command-line tool leveraging the GA4GH SDK
"""
repository = "https://github.com/ga4gh/ga4gh-sdk/tree/main/cli"
version.workspace = true
authors.workspace = true
edition.workspace = true
readme.workspace = true
license-file.workspace = true

[dependencies]
ga4gh-lib = { path = "../lib", features = ["workflow-contracts"] }
clap = "4"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "^1.0"
tempfile = "3.2"
async-trait = "0.1"
dirs = "7.0.0"
anyhow = "1.0.86"
url = "2.5.2"
log = "0.4.22"
env_logger = "0.11.5"
futures-util = "0.3"
percent-encoding = "2"
# Same major version as ga4gh-lib; `stream` reads downloads in chunks.
# object_store uses this reqwest too, so its S3 requests also use OpenSSL
# (`default-tls`): reqwest prefers it over the rustls that object_store enables.
reqwest = { version = "0.12", features = ["stream"] }
# S3 downloads, using object_store's AWS configuration and credential chain.
object_store = { version = "0.12", default-features = false, features = ["aws"] }

[features]
# Runs the CLI against Starter Kit WES; see tests/README.md.
wes_docker_integration_tests = []
# Runs the `tes` commands against proTES with an access token; see
# tests/README.md.
protes_integration_tests = []
# Runs the `tes` commands against Funnel; see tests/README.md.
integration_tests = []
# Runs the CLI against TRS-Filer; see tests/README.md.
trs_filer_integration_tests = []
# Runs `login`, refreshes and `logout` against Keycloak; see tests/README.md.
keycloak_integration_tests = []

[dev-dependencies]
mockito = "1.7"

[[bin]]
name = "ga4gh-cli"
path = "src/main.rs"
