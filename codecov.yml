# Codecov settings for the reports that the `codecov` job of
# `.github/workflows/ci.yml` uploads; see docs/development.md.
#
# The statuses are informational: they show the coverage on pull requests but
# never fail. `CI passed` remains the only required check.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

# Already left out of the uploaded report by `make coverage`
# (`COVERAGE_IGNORE` in the `Makefile`); listed here for reports from other
# sources
ignore:
  - "lib/src/clients/*/models/**"
  - "lib/src/clients/*/wire/*/models/**"
  - "lib/src/utils/test_utils.rs"

comment:
  layout: "condensed_header, condensed_files, condensed_footer"
  # Comment only when the coverage changes
  require_changes: true
