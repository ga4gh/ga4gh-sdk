# Codecov settings for the reports that the `coverage` job of
# `.github/workflows/ci.yml` uploads; see docs/development.md.
#
# The statuses are informational: they show the coverage on pull requests but
# never fail. `CI passed` remains the only required check.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "condensed_header, condensed_files, condensed_footer"
  # Comment only when the coverage changes
  require_changes: true
