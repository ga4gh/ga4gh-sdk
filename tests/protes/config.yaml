# Config overlay of proTES for `compose.yaml` of this directory: tokens of
# the fake identity provider (users and groups of `fake_tes.py`), and one TES
# backend, the Funnel server of the Compose file
security:
  auth:
    issuers:
      - http://fake-tes:8080/oidc/
    audience:
      - smoke-client
    userinfo_claims:
      - groups
  access_control:
    claim_groups: groups
    group_mapping:
      smoke-users: user
      smoke-admins: admin
custom:
  tes:
    backends:
      - type: ga4gh-tes
        url: http://funnel:8000
        url_schemes:
          - http
        auth: none
    url_schemes:
      - http
  controllers:
    post_task:
      polling:
        wait: 1
plugins:
  pipeline:
    - id: route
      alternatives:
        - plugin: foca.routing.ordered
