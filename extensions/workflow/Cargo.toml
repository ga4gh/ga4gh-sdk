[workspace]

[package]
name = "ga4gh-workflow-extension"
version = "0.1.0"
edition = "2021"
license-file = "../../LICENSE"
description = "Native GA4GH CLI workflow commands"

[lib]
crate-type = ["cdylib"]

[dependencies]
ga4gh-cli-protocol = { path = "../../cli-protocol" }
ga4gh-extension-abi = { path = "../../extension-abi" }
ga4gh-lib = { path = "../../lib", features = ["workflow-contracts"] }
serde_json = "1"
anyhow = "1"

[build-dependencies]
serde_json = "1"
