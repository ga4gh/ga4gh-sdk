[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ga4gh-workflow"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["ga4gh-sdk>=0.1.1"]
description = "Synchronous typed bindings for the native GA4GH workflow provider"

[tool.setuptools]
packages = ["ga4gh_workflow"]

[tool.setuptools.package-data]
ga4gh_workflow = ["py.typed"]
