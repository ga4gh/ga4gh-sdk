[package]
name = "ga4gh-workflow"
version = "0.1.0"
edition = "2021"
description = "Typed client for the installed GA4GH workflow provider"
license-file = "../../../../LICENSE"

[dependencies]
ga4gh-lib = { path = "../../../../lib" }
ga4gh-cli-protocol = { path = "../../../../cli-protocol" }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
tempfile = "3"
mockito = "1"
